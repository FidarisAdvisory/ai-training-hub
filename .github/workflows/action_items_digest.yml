name: 6 PM Action Item Digest

on:
  schedule:
    # 6:00 PM CDT (UTC-5, May-Nov) = 23:00 UTC
    # 6:00 PM CST (UTC-6, Nov-Mar) = 00:00 UTC next day
    # This cron covers daylight-saving time (summer/fall). In winter, change to '0 0 * * *'.
    - cron: '0 23 * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  send-action-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run action item digest agent
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NOTION_API_TOKEN:     ${{ secrets.NOTION_API_TOKEN }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
          USER_EMAIL:           ${{ vars.USER_EMAIL }}
          USER_TIMEZONE:        America/Chicago
        run: python -m agent.action_digest_main
