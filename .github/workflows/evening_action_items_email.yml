name: Evening Action Items Digest

on:
  schedule:
    # 6:00 PM CDT (UTC-5) = 23:00 UTC  — runs May through Oct
    # 6:00 PM CST (UTC-6) = 00:00 UTC next day — runs Nov through Apr
    # Using 23:00 UTC covers 6 PM CDT (summer). In winter, the email arrives at 5 PM CST.
    # To get exact 6 PM year-round you'd need two cron entries; single entry is simpler.
    - cron: '0 23 * * *'
  workflow_dispatch:   # allow manual trigger for testing

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run evening action items agent
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FATHOM_API_KEY:         ${{ secrets.FATHOM_API_KEY }}
          GOOGLE_CLIENT_ID:       ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET:   ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN:   ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          NOTION_API_TOKEN:       ${{ secrets.NOTION_API_TOKEN }}
          NOTION_MEETINGS_DB_ID:  ${{ secrets.NOTION_MEETINGS_DB_ID }}
          RECIPIENT_EMAIL:        ${{ secrets.RECIPIENT_EMAIL }}
          USER_EMAIL:             ${{ vars.USER_EMAIL }}
          USER_NAME:              Fidel Salazar
          USER_TIMEZONE:          America/Chicago
          FATHOM_LOOKBACK_DAYS:   "7"
        run: python -m agent.action_items_main
