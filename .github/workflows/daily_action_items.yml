name: Daily Action Items Digest

on:
  schedule:
    # 6:00 PM CDT (UTC-5) in summer  = 23:00 UTC
    # 6:00 PM CST (UTC-6) in winter  = 00:00 UTC (fires at 5 PM CST — acceptable trade-off)
    - cron: '0 23 * * *'
  workflow_dispatch: # allow manual trigger for testing

jobs:
  send-action-items:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run action items agent
        env:
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_CLIENT_ID:     ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          RECIPIENT_EMAIL:      ${{ secrets.RECIPIENT_EMAIL }}
          USER_EMAIL:           ${{ vars.USER_EMAIL }}
          USER_TIMEZONE:        America/Chicago
        run: python -m agent.action_items_main
